info:
  name: PostMonitor
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/services/1/monitors/"
  body:
    type: json
    data: |-
      {
        "path": "/test",
        "intervalSeconds": 10,
        "httpMethodId": 1
      }
  auth:
    type: bearer
    token: "{{bearer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
