info:
  name: PutMonitor
  type: http
  seq: 4

http:
  method: PUT
  url: "{{host}}/services/{{serviceId}}/monitors/{{monitorId}}"
  body:
    type: json
    data: |-
      {
        "path": "/updatedPath",
        "intervalSeconds": 5,
        "httpMethodId": 2
      }
  auth:
    type: bearer
    token: "{{bearer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
