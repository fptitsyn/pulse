info:
  name: PutMonitor
  type: http
  seq: 4

http:
  method: PUT
  url: "{{host}}/services/{{serviceId}}/monitors/{{monitorId}}"
  body:
    type: json
    data: |-
      {
        "path": "about/mirea-today/",
        "intervalSeconds": 10,
        "httpMethod": "GET",
        "isEnabled": false
      }
  auth:
    type: bearer
    token: "{{bearer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
