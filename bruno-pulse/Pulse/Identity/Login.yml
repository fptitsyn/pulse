info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: localhost:5069/login?useCookies=false
  params:
    - name: useCookies
      value: "false"
      type: query
  body:
    type: json
    data: |-
      {
        "email": "test@example.com",
        "name": "testuser",
        "password": {{test_password}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
